name: skillbridge_ai
description: SkillBridge AI — Job & Skill Recommendation App (SDG-8), AI-powered job and skill recommendation system for Bangladeshi students
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # Image upload
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  path: ^1.9.0
  
  # Authentication
  google_sign_in: ^6.2.1
  # google_sign_in: ^7.2.0
  local_auth: ^2.3.0
  flutter_web_auth_2: ^4.0.0

  # State management
  provider: ^6.1.1

  # Local storage
  shared_preferences: ^2.3.0

  # Charts & visualisations
  fl_chart: ^1.1.1

  # Animations
  flutter_animate: ^4.3.0
  lottie: ^3.0.0
  shimmer: ^3.0.0

  # Typography
  google_fonts: ^8.0.2

  # Networking & images
  http: ^1.2.0
  cached_network_image: ^3.3.1
  meta: ^1.9.0
  # Date/time formatting
  intl: ^0.20.2

  # File handling
  file_picker: ^10.3.10
  syncfusion_flutter_pdf: ^33.1.46  # PDF text extraction
  archive: ^3.6.1                   # DOCX (ZIP) extraction

  # URL launcher
  url_launcher: ^6.3.0

  # Word cloud
  word_cloud: 1.0.3

  # Icons
  cupertino_icons: ^1.0.8
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"